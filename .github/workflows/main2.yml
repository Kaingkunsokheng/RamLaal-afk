name: Run 2 Bots 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  two-bots:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mineflayer
        run: npm install mineflayer mineflayer-pathfinder

      - name: Start Bot 1 and Bot 2
        run: |
          cat << 'EOF' > bots.js
          const mineflayer = require('mineflayer');
          const { pathfinder, Movements, goals } = require('mineflayer-pathfinder');

          function startBot1() {
            const bot1 = mineflayer.createBot({
              host: 'sokhengmc1.mcsh.gg',
              port: 25565,
              username: 'AFK_Bot247',
              version: '1.21.4',
              auth: 'offline'
            });

            bot1.on('spawn', () => {
              console.log('Bot 1 (AFK_Bot247) joined!');
              setInterval(() => {
                bot1.setControlState('jump', true);
                setTimeout(() => bot1.setControlState('jump', false), 500);
              }, 30000);
            });

            bot1.on('kicked', (r) => console.log('Bot 1 Kicked:', r));
            bot1.on('error', (e) => console.log('Bot 1 Error:', e.message));
            bot1.on('end', () => setTimeout(startBot1, 10000));
          }

          function startBot2() {
            const bot2 = mineflayer.createBot({
              host: 'sokhengmc1.mcsh.gg',
              port: 25565,
              username: 'AI_Helper247',
              version: '1.21.4',
              auth: 'offline'
            });

            bot2.loadPlugin(pathfinder);
            let guardMode = false;

            bot2.on('spawn', () => {
              console.log('Bot 2 (AI_Helper247) joined!');
              const defaultMove = new Movements(bot2);
              bot2.pathfinder.setMovements(defaultMove);
              bot2.chat('AI_Helper247 បានចូលរួចរាល់ហើយ!');
            });

            // អានគ្រប់សារទាំងអស់ក្នុង Chat (ដំណើរការជាមួយ Bedrock, Geyser និងគ្រប់ Plugin Chat)
            bot2.on('messagestr', (msg) => {
              if (msg.includes('AI_Helper247')) return;
              const text = msg.toLowerCase();

              // ស្វែងរកអ្នកលេងដែលនៅជិត Bot បំផុត ឬឈ្មោះអ្នកលេងក្នុងសារ
              let target = null;
              for (const name of Object.keys(bot2.players)) {
                if (name !== 'AI_Helper247' && name !== 'AFK_Bot247' && msg.includes(name)) {
                  target = bot2.players[name]?.entity;
                  break;
                }
              }
              if (!target) {
                target = bot2.nearestEntity(e => e.type === 'player' && e.username !== 'AFK_Bot247');
              }

              if (text.endsWith('come') || text.includes(': come') || text.includes('> come')) {
                if (!target) {
                  bot2.chat('ខ្ញុំមើលមិនឃើញអ្នកទេ សូមដើរមកជិតបន្តិច!');
                  return;
                }
                bot2.chat('កំពុងរត់ទៅរកអ្នក!');
                bot2.pathfinder.setGoal(new goals.GoalFollow(target, 2), true);
              }

              if (text.endsWith('stop') || text.includes(': stop') || text.includes('> stop')) {
                guardMode = false;
                bot2.pathfinder.setGoal(null);
                bot2.chat('ឈប់ហើយ!');
              }

              if (text.endsWith('guard') || text.includes(': guard') || text.includes('> guard')) {
                guardMode = true;
                bot2.chat('កំពុងយាមការពារសត្វចម្លែក!');
              }
            });

            setInterval(() => {
              if (!guardMode || !bot2.entity) return;
              const mob = bot2.nearestEntity(e => e.type === 'mob' && e.position.distanceTo(bot2.entity.position) < 6);
              if (mob) {
                bot2.lookAt(mob.position.offset(0, 1, 0));
                bot2.attack(mob);
              }
            }, 600);

            bot2.on('kicked', (r) => console.log('Bot 2 Kicked:', r));
            bot2.on('error', (e) => console.log('Bot 2 Error:', e.message));
            bot2.on('end', () => setTimeout(startBot2, 10000));
          }

          startBot1();
          setTimeout(startBot2, 6000);
          EOF
          node bots.js
