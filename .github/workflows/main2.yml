            bot.on('error', (err) => console.log('Error:', err.message));
            bot.on('end', () => {
              console.log('Disconnected. Reconnecting in 10s...');
              setTimeout(startAIBot, 10000);
            });
          }

          startAIBot();
          EOF
          node ai_bot.js
