name: Run AI Bot 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  ai-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AI & Viewer Libraries
        run: |
          npm install mineflayer mineflayer-pathfinder mineflayer-pvp prismarine-viewer
          npm install -g localtunnel

      - name: Start AI Bot with Live Viewer
        run: |
          cat << 'EOF' > ai_bot.js
          const mineflayer = require('mineflayer');
          const { pathfinder, Movements, goals } = require('mineflayer-pathfinder');
          const pvp = require('mineflayer-pvp').plugin;
          const mineflayerViewer = require('prismarine-viewer').mineflayer;

          function startAIBot() {
            const bot = mineflayer.createBot({
              host: 'sokhengmc1.mcsh.gg',
              port: 25565,
              username: 'AI_Helper247',
              version: '1.21.4',
              auth: 'offline'
            });

            bot.loadPlugin(pathfinder);
            bot.loadPlugin(pvp);

            let guardPos = null;

            bot.once('spawn', () => {
              mineflayerViewer(bot, { port: 3007, firstPerson: true });
              console.log('Viewer started on port 3007');
            });

            bot.on('spawn', () => {
              const defaultMove = new Movements(bot);
              bot.pathfinder.setMovements(defaultMove);
            });

            bot.on('chat', (username, message) => {
              if (username === bot.username) return;
              const target = bot.players[username] ? bot.players[username].entity : null;

              if (message === 'come' && target) {
                bot.pathfinder.setGoal(new goals.GoalFollow(target, 2), true);
              }
              if (message === 'stop') {
                guardPos = null;
                bot.pvp.stop();
                bot.pathfinder.setGoal(null);
              }
              if (message === 'guard') {
                guardPos = bot.entity.position.clone();
              }
            });

            bot.on('physicsTick', () => {
              if (!guardPos) return;
              const filter = e => e.type === 'mob' && e.position.distanceTo(bot.entity.position)  setTimeout(startAIBot, 10000));
          }

          startAIBot();
          EOF
          node ai_bot.js &
          sleep 5
          lt --port 3007
