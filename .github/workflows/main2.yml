name: Run 2 Bots 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  two-bots:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Libraries
        run: npm install mineflayer mineflayer-pathfinder mineflayer-pvp

      - name: Start Bot 1 (AFK) and Bot 2 (AI)
        run: |
          cat << 'EOF' > bots.js
          const mineflayer = require('mineflayer');
          const { pathfinder, Movements, goals } = require('mineflayer-pathfinder');
          const pvp = require('mineflayer-pvp').plugin;

          // --- BOT 1: AFK BOT ---
          function startBot1() {
            const bot1 = mineflayer.createBot({
              host: 'sokhengmc1.mcsh.gg',
              port: 25565,
              username: 'AFK_Bot247',
              version: '1.21.4',
              auth: 'offline'
            });

            bot1.on('spawn', () => {
              console.log('Bot 1 (AFK_Bot247) joined!');
              setInterval(() => {
                bot1.setControlState('jump', true);
                setTimeout(() => bot1.setControlState('jump', false), 500);
              }, 30000);
            });

            bot1.on('end', () => setTimeout(startBot1, 10000));
            bot1.on('error', (err) => console.log('Bot 1 Error:', err.message));
          }

          // --- BOT 2: AI BOT ---
          function startBot2() {
            const bot2 = mineflayer.createBot({
              host: 'sokhengmc1.mcsh.gg',
              port: 25565,
              username: 'AI_Helper247',
              version: '1.21.4',
              auth: 'offline'
            });

            bot2.loadPlugin(pathfinder);
            bot2.loadPlugin(pvp);

            let guardPos = null;

            bot2.on('spawn', () => {
              console.log('Bot 2 (AI_Helper247) joined!');
              const defaultMove = new Movements(bot2);
              bot2.pathfinder.setMovements(defaultMove);
              bot2.chat('AI_Helper247 និង AFK_Bot247 បានចូលរួចរាល់ហើយ!');
            });

            bot2.on('chat', (username, message) => {
              if (username === bot2.username || username === 'AFK_Bot247') return;
              const target = bot2.players[username] ? bot2.players[username].entity : null;

              if (message === 'come' && target) {
                bot2.pathfinder.setGoal(new goals.GoalFollow(target, 2), true);
              }
              if (message === 'stop') {
                guardPos = null;
                bot2.pvp.stop();
                bot2.pathfinder.setGoal(null);
              }
              if (message === 'guard') {
                guardPos = bot2.entity.position.clone();
              }
            });

            bot2.on('physicsTick', () => {
              if (!guardPos) return;
              const filter = e => e.type === 'mob' && e.position.distanceTo(bot2.entity.position)  setTimeout(startBot2, 10000));
            bot2.on('error', (err) => console.log('Bot 2 Error:', err.message));
          }

          // ចាប់ផ្តើម Bot ទី 1 ភ្លាមៗ និង Bot ទី 2 ក្រោយ 5 វិនាទី (កុំឱ្យ Server ទាត់ចេញដោយសារចូលជាន់គ្នា)
          startBot1();
          setTimeout(startBot2, 5000);
          EOF
          node bots.js
